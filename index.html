<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLCOMP Registration Form</title>
</head>
<body style="background-color: #f2f2f2; font-family: Arial, sans-serif;">
<main style="width: 500px; margin: auto;">
  <header>
    <h1 style="text-align: center; color: darkgreen;">COLCOMP Registration Form</h1>
    <p>Please fill in your details below.</p>
  </header>

  <form style="background-color: white; padding: 20px; border: 1px solid gray;">
    <fieldset>
  <legend>Student Information</legend>
  <label for="name" style="display: block; margin-top: 10px; font-weight: bold;">
  Full Name:
</label>

<input
  type="text"
  id="name"
  name="name"
  required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

<label for="matric-number" style="display: block; margin-top: 10px; font-weight: bold;">
  Matric Number:
</label>

<input
  type="text"
  id="matric-number"
  name="matric_number"
  required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

<label for="department" style="display: block; margin-top: 10px; font-weight: bold;">
  Department:
</label>

<select id="department" name="department" required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

  <option value="">Select your department</option>
  <option value="cyber-security">Cyber Security</option>
  <option value="data-science">Data Science</option>
  <option value="information-technology">Information Technology</option>
  <option value="information-communication-technology">
    Information Communication Technology
  </option>
  <option value="software-engineering">Software Engineering</option>
  <option value="information-systems">Information Systems</option>
  <option value="computer-science">Computer Science</option>

</select>

<label for="email" style="display: block; margin-top: 10px; font-weight: bold;">
  Email Address:
</label>

<input type="email" id="email" name="email" required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

<label for="phone" style="display: block; margin-top: 10px; font-weight: bold;">
  Phone Number:
</label>

<input type="tel" id="phone" name="phone" required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

<fieldset style="margin-top: 15px; padding: 10px; border: 1px solid gray;">
  <legend style="font-weight: bold;">Gender:</legend>

  <input type="radio" id="female" name="gender" value="female" required>
  <label for="female" style="margin-right: 10px;">Female</label>

  <input type="radio" id="male" name="gender" value="male">
  <label for="male" style="margin-right: 10px;">Male</label>

  <input type="radio" id="prefer-not-to-say" name="gender" value="prefer-not-to-say">
  <label for="prefer-not-to-say">Prefer not to say</label>
</fieldset>

<label for="programme" style="display: block; margin-top: 10px; font-weight: bold;">
  Programme:
</label>

<select id="programme" name="programme" required
  style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">

  <option value="">Select your programme</option>
  <option value="full-time-weekdays">Full-time (Weekdays)</option>
  <option value="weekend">Weekend Programme</option>

</select>

<button type="submit"
  style="width: 100%; margin-top: 20px; padding: 10px; background-color: darkgreen; color: white; border: none; border-radius: 4px; cursor: pointer;">
  Submit Registration
</button>
</fieldset>
</form>
</main>
</body>
</html>
